name: build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# swing-ui-agent and the Lagoon theme are not on Maven Central yet: install them from their repos, then build and
# test this one.
jobs:
  build:
    name: Linux / Java 8
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Check out swing-ui-agent
        uses: actions/checkout@v7
        with:
          repository: kormcrete/swing-ui-agent
          path: swing-ui-agent
      - name: Check out the Lagoon theme
        uses: actions/checkout@v7
        with:
          repository: kormcrete/swing-flatlaf-lagoon-theme
          path: swing-flatlaf-lagoon-theme
      - uses: actions/setup-java@v6
        with:
          distribution: zulu
          java-version: '8'
          cache: maven
      - name: Install swing-ui-agent
        run: mvn -B -f swing-ui-agent/pom.xml install -DskipTests
      - name: Install the Lagoon theme
        run: mvn -B -f swing-flatlaf-lagoon-theme/pom.xml install -DskipTests
      - name: Build and install the Order Desk plugin (its domain steps; the app's UI tests use it)
        run: mvn -B -f order-desk-plugin/pom.xml install
      - name: Build and test
        run: mvn -B verify
      - name: UI tests (Order Desk with the agent, on a virtual display)
        run: .github/scripts/ui-tests.sh
      - name: Keep test reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-reports
          path: |
            target/surefire-reports/
            target/failsafe-reports/
            order-desk-plugin/target/surefire-reports/
          if-no-files-found: ignore
      - name: Keep UI screenshots
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ui-screenshots
          path: |
            target/ui-screenshots/
            target/ui-failures/
            target/failsafe-reports/
            target/app.log
          if-no-files-found: ignore
